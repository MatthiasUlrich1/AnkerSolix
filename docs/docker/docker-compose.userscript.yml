# Example: stock buanet image + optional userscript for Python 3.12
# Not required from adapter 0.10.87 (stock Python 3.11 is accepted).
# Mount a host folder that contains userscript_firststart.sh (see userscript_firststart.sh).
# See ../docker-buanet.md
services:
  iobroker:
    container_name: iobroker
    image: buanet/iobroker:latest
    hostname: iobroker
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - iobrokerdata:/opt/iobroker
      # Adjust host path:
      - ./userscripts:/opt/userscripts
    environment:
      - TZ=Europe/Berlin

volumes:
  iobrokerdata:
